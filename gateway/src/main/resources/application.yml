server:
  port: 8080
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      timeout: 500ms
      connect-timeout: 500ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates: [Path=/api/auth/**]
        - id: products
          uri: ${PRODUCT_URL:http://localhost:8082}
          predicates: [Path=/api/products/**]
        - id: inventory
          uri: ${INVENTORY_URL:http://localhost:8083}
          predicates: [Path=/api/inventory/**]
        - id: orders
          uri: ${ORDER_URL:http://localhost:8084}
          predicates: [Path=/api/orders/**]
        - id: cart
          uri: ${ORDER_URL:http://localhost:8084}
          predicates: [Path=/api/cart/**]
        - id: payments
          uri: ${PAYMENT_URL:http://localhost:8085}
          predicates: [Path=/api/payments/**]
        - id: search
          uri: ${SEARCH_URL:http://localhost:8086}
          predicates: [Path=/api/search/**]
        - id: notifications
          uri: ${NOTIFICATION_URL:http://localhost:8087}
          predicates: [Path=/api/notifications/**]
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
  metrics:
    tags:
      application: gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
